version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: videogen
      POSTGRES_USER: videogen
      POSTGRES_PASSWORD: videogen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://videogen:videogen@postgres:5432/videogen
      REDIS_URL: redis://redis:6379/0
      VIDEO_MODEL_PROVIDER: demo
      SECRET_KEY: dev-secret
      PUBLIC_STORAGE_URL: http://localhost:8000/storage
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://videogen:videogen@postgres:5432/videogen
      REDIS_URL: redis://redis:6379/0
      VIDEO_MODEL_PROVIDER: demo
      SECRET_KEY: dev-secret
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
